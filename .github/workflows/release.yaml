name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Install uv
      uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
      with:
        version: "0.9.14"
    - name: Install Dependencies
      run: |
        uv venv
        uv pip install -r src/starscream.py
    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@b24f9b7859f1022afcfad039eb8b8ac3ae299e39
      with:
        nuitka-version: main
        script-name: src/starscream.py
        mode: app
    - name: Upload Artifacts
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: starscream-${{ runner.os }}
        path: |
          build/*.bin
          build/*.exe
          build/*.app/**/*
        include-hidden-files: true
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
         path: ./build
      - name: Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          draft: false
          files: |
            build/*.bin
            build/*.exe
            build/*.app/**/*
          generate_release_notes: true
          prerelease: false
